<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COVID X-Ray Classifier</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef4ff, #f8fbff);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: white;
            border-radius: 24px;
            padding: 35px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12);
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: #172554;
            font-size: 32px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 30px;
        }

        .upload-box {
            border: 2px dashed #94a3b8;
            border-radius: 18px;
            padding: 25px;
            background: #f8fafc;
        }

        input[type="file"] {
            width: 100%;
            padding: 12px;
        }

        #preview {
            display: none;
            max-width: 100%;
            max-height: 350px;
            margin: 25px auto;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }

        button {
            margin-top: 20px;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #94a3b8;
            cursor: not-allowed;
        }

        #loading {
            display: none;
            margin-top: 20px;
            color: #475569;
        }

        .result {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border-radius: 18px;
            background: #f8fafc;
            text-align: left;
        }

        .result h2 {
            margin-top: 0;
            color: #0f172a;
        }

        .positive {
            color: #dc2626;
        }

        .negative {
            color: #16a34a;
        }

        .confidence {
            font-size: 24px;
            font-weight: bold;
        }

        .probabilities {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid #cbd5e1;
        }

        .disclaimer {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🩺 COVID X-Ray Classifier</h1>

    <p class="subtitle">
        Upload a chest X-Ray image for AI-based classification
    </p>

    <div class="upload-box">

        <input
            type="file"
            id="fileInput"
            accept="image/png,image/jpeg,image/jpg"
        >

        <img id="preview" alt="X-Ray Preview">

        <button id="predictBtn" onclick="predictImage()">
            🔍 Predict X-Ray
        </button>

        <div id="loading">
            ⏳ Analyzing image... Please wait
        </div>

    </div>

    <div id="result" class="result"></div>

    <div class="disclaimer">
        ⚠️ Academic/demo project only. This system is not a medical diagnosis.
    </div>

</div>

<script>

const fileInput = document.getElementById("fileInput");
const preview = document.getElementById("preview");

fileInput.addEventListener("change", function () {

    const file = this.files[0];

    if (file) {
        preview.src = URL.createObjectURL(file);
        preview.style.display = "block";
    }

});

async function predictImage() {

    const file = fileInput.files[0];

    if (!file) {
        alert("Please select an X-Ray image first.");
        return;
    }

    const button = document.getElementById("predictBtn");
    const loading = document.getElementById("loading");
    const result = document.getElementById("result");

    button.disabled = true;
    loading.style.display = "block";
    result.style.display = "none";

    const formData = new FormData();
    formData.append("file", file);

    try {

        const response = await fetch("/predict", {
            method: "POST",
            body: formData
        });

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.detail || "Prediction failed");
        }

        let probabilityHTML = "";

        for (const [key, value] of Object.entries(data.class_probabilities)) {
            probabilityHTML += `
                <p><strong>${key}:</strong> ${value}%</p>
            `;
        }

        const resultClass =
            data.result === "COVID Positive"
            ? "positive"
            : "negative";

        result.innerHTML = `
            <h2 class="${resultClass}">
                ${data.result}
            </h2>

            <p>
                <strong>Predicted Class:</strong>
                ${data.predicted_class}
            </p>

            <p class="confidence">
                Confidence: ${data.confidence_percent}%
            </p>

            <div class="probabilities">
                <h3>Class Probabilities</h3>
                ${probabilityHTML}
            </div>
        `;

        result.style.display = "block";

    } catch (error) {

        result.innerHTML = `
            <h2 class="positive">❌ Error</h2>
            <p>${error.message}</p>
        `;

        result.style.display = "block";

    } finally {

        button.disabled = false;
        loading.style.display = "none";

    }
}

</script>

</body>
</html>
